<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="title">关于 · Quant AI Signal</title>
<style>
:root { --accent-cyan: #00d4ff; --accent-green: #00ff88; --text-body: rgba(200,220,255,0.75); --text-dim: rgba(200,220,255,0.4); --bg: #0a0e17; }
body { font-family: -apple-system,'Segoe UI',monospace; background: var(--bg); color: #c8dcff; max-width: 720px; margin: 40px auto; padding: 0 20px; line-height: 1.8; }
h1 { color: var(--accent-cyan); }
h2 { color: var(--accent-green); font-size: 1.1rem; margin-top: 28px; }
p, li { color: var(--text-body); font-size: 0.9rem; }
a { color: var(--accent-cyan); }
.lang-btn {
  position: fixed; top: 10px; right: 14px; z-index: 200;
  background: rgba(0,180,255,0.1); border: 1px solid rgba(0,180,255,0.25);
  color: var(--accent-cyan); padding: 4px 14px; border-radius: 6px;
  cursor: pointer; font-size: 0.78rem; font-family: var(--font-body,monospace);
  transition: 0.2s;
}
.lang-btn:hover { background: rgba(0,180,255,0.2); }
</style>
</head>
<body>
<button class="lang-btn" onclick="switchLang()" id="langBtn">EN</button>
<h1 data-i18n="h1">关于本站</h1>

<h2 data-i18n="what_h">Quant AI Signal 是什么？</h2>
<p data-i18n="what_p">Quant AI Signal 基于 <strong>XGBoost 多标签分类模型</strong>，对港股、沪深、美股历史行情进行智能回测分析，输出四种交易信号：买入、卖出、强买、强卖。模型综合考量价格趋势、成交量变化、技术指标等近百项特征，每日滚动推理。</p>

<h2 data-i18n="source_h">数据来源</h2>
<p data-i18n="source_p">数据来源覆盖 <strong>akshare</strong>（A 股/港股/美股）与 <strong>baostock</strong>（沪深），实时获取公开行情。所有运算在服务端完成，无需本地计算资源。</p>

<h2 data-i18n="disclaimer_h">免责声明</h2>
<p data-i18n="disclaimer_p">本工具仅供学习研究使用。所有输出信号均为模型推断结果，不构成任何投资建议。过往表现不代表未来收益。投资有风险，入市需谨慎。</p>

<script>
const LANG = {
  zh: {
    title: '关于 · Quant AI Signal',
    h1: '关于本站',
    what_h: 'Quant AI Signal 是什么？',
    what_p: 'Quant AI Signal 基于 XGBoost 多标签分类模型，对港股、沪深、美股历史行情进行智能回测分析，输出四种交易信号：买入、卖出、强买、强卖。模型综合考量价格趋势、成交量变化、技术指标等近百项特征，每日滚动推理。',
    source_h: '数据来源',
    source_p: '数据来源覆盖 akshare（A 股/港股/美股）与 baostock（沪深），实时获取公开行情。所有运算在服务端完成，无需本地计算资源。',
    disclaimer_h: '免责声明',
    disclaimer_p: '本工具仅供学习研究使用。所有输出信号均为模型推断结果，不构成任何投资建议。过往表现不代表未来收益。投资有风险，入市需谨慎。',
  },
  en: {
    title: 'About · Quant AI Signal',
    h1: 'About',
    what_h: 'What is Quant AI Signal?',
    what_p: 'Quant AI Signal uses an XGBoost multi-label classification model to analyze historical market data for HK, A-share, and US stocks. It generates four trading signals: Buy, Sell, Strong Buy, Strong Sell. The model evaluates dozens of features including price trends, volume changes, and technical indicators, with daily rolling inference.',
    source_h: 'Data Sources',
    source_p: 'Data sources include akshare (A/HK/US) and baostock (China A-shares), fetching real-time public quotes. All computation runs server-side with no local resources needed.',
    disclaimer_h: 'Disclaimer',
    disclaimer_p: 'This tool is for educational and research purposes only. All output signals are model inferences and do not constitute investment advice. Past performance does not guarantee future results. Trade at your own risk.',
  }
};

let currentLang = localStorage.getItem('lang') || 'zh';
function t(key) {
  const v = LANG[currentLang] ? LANG[currentLang][key] : LANG['zh'][key];
  return typeof v === 'function' ? v : (v || key);
}
function translatePage() {
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (key === 'what_p' || key === 'source_p') {
      el.innerHTML = t(key);
    } else {
      el.textContent = t(key);
    }
  });
  document.getElementById('langBtn').textContent = currentLang === 'zh' ? 'EN' : '中';
}
function switchLang() {
  currentLang = currentLang === 'zh' ? 'en' : 'zh';
  localStorage.setItem('lang', currentLang);
  translatePage();
}
translatePage();
</script>
</body>
</html>
