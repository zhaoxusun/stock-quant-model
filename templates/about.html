<h1>关于本站</h1>
<p>Quant AI Signal 是一个基于 XGBoost 多标签分类的量化信号分析工具。</p>

<h2>技术原理</h2>
<p>通过 XGBoost 模型对 A 股、港股、美股的历史量价数据进行多标签分类训练，输出 4 路交易信号：买入、卖出、强买入、强卖出。模型基于特征工程（成交量变化、价格动量、波动率等）生成预测概率，辅助投资者进行技术分析参考。</p>

<h2>数据来源</h2>
<p>SH/SZ：baostock | HK/US：akshare | 部分历史回测数据来源于 CSV 文件</p>

<h2>免责声明</h2>
<p>本工具仅供学习研究使用。所有输出信号均为模型推断结果，不构成任何投资建议。过往表现不代表未来收益。投资有风险，入市需谨慎。</p>
