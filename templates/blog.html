<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="title">博客 · Quant AI Signal</title>
<meta name="description" content="Quant AI Signal 量化交易信号分析工具的使用指南、策略原理与最新动态。">
<style>
:root { --accent-cyan: #00d4ff; --accent-green: #00ff88; --text-body: rgba(200,220,255,0.75); --text-dim: rgba(200,220,255,0.4); --bg: #0a0e17; --card-bg: rgba(255,255,255,0.03); --card-border: rgba(0,180,255,0.12); }
body { font-family: -apple-system,'Segoe UI',monospace; background: var(--bg); color: #c8dcff; max-width: 720px; margin: 40px auto; padding: 0 20px; line-height: 1.8; }
h1 { color: var(--accent-cyan); }
p, li { color: var(--text-body); font-size: 0.9rem; }
a { color: var(--accent-cyan); text-decoration: none; }
a:hover { text-decoration: underline; }
.post-list { list-style: none; padding: 0; }
.post-list li { padding: 16px 20px; margin-bottom: 12px; background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 10px; }
.post-list li .date { font-size: 0.75rem; color: var(--text-dim); }
.post-list li .title { font-size: 1rem; color: var(--accent-cyan); display: block; margin: 4px 0; }
.post-list li .desc { font-size: 0.85rem; color: var(--text-body); }
.footer-links { margin-top: 48px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.06); text-align: center; font-size: 0.85rem; }
.footer-links a { margin: 0 10px; }
</style>
</head>
<body>
{% include '_header.html' %}
<h1 data-i18n="h1">📝 博客</h1>
<p style="color:var(--text-dim);margin-top:-10px;" data-i18n="subtitle">Quant AI Signal 使用指南与量化策略原理</p>

<ul class="post-list">
  <li>
    <div class="date" data-i18n="post1_date">2026 年 6 月 3 日</div>
    <a class="title" href="/blog/how-to-use" data-i18n="post1_title">Quant AI Signal 使用指南：如何解读交易信号</a>
    <div class="desc" data-i18n="post1_desc">详细讲解 XGBoost 模型的四种交易信号含义、K 线图使用方法、以及如何结合信号做出理性判断。</div>
  </li>
</ul>

<script>
const LANG = {
  zh: {
    title: '博客 · Quant AI Signal',
    h1: '📝 博客',
    subtitle: 'Quant AI Signal 使用指南与量化策略原理',
    post1_date: '2026 年 6 月 3 日',
    post1_title: 'Quant AI Signal 使用指南：如何解读交易信号',
    post1_desc: '详细讲解 XGBoost 模型的四种交易信号含义、K 线图使用方法、以及如何结合信号做出理性判断。',
    back_home: '← 返回首页',
    footer_privacy: '隐私政策',
    footer_about: '关于本站',
    footer_terms: '服务条款',
  },
  en: {
    title: 'Blog · Quant AI Signal',
    h1: '📝 Blog',
    subtitle: 'Quant AI Signal Guide & Quant Strategy Principles',
    post1_date: 'June 3, 2026',
    post1_title: 'Quant AI Signal Guide: How to Read Trading Signals',
    post1_desc: 'Detailed explanation of the four XGBoost trading signals, K-line chart usage, and how to make rational judgments based on signals.',
    back_home: '← Back to Home',
    footer_privacy: 'Privacy Policy',
    footer_about: 'About',
    footer_terms: 'Terms of Service',
  }
};

let currentLang = localStorage.getItem('lang') || 'zh';
function t(key) {
  const v = LANG[currentLang] ? LANG[currentLang][key] : LANG['zh'][key];
  return typeof v === 'function' ? v : (v || key);
}
function translatePage() {
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    el.textContent = t(key);
  });
  document.getElementById('langBtn').textContent = currentLang === 'zh' ? 'EN' : '中';
}
function switchLang() {
  currentLang = currentLang === 'zh' ? 'en' : 'zh';
  localStorage.setItem('lang', currentLang);
  translatePage();
}
translatePage();
</script>
</body>
</html>
